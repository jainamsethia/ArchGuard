<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchGuard - Job Submission</title>
    
    <link rel="stylesheet" href="/index.css"/>
    <!-- Must stay in <head> and stay non-deferred: it sets the theme on <html>
         before the first paint, which is what stops a stored light preference
         from flashing dark first. -->
    <script src="/theme.js"></script>
</head>
<body class="page-index">

<!-- Sign-in overlay — shown when there is no session for this visitor.
     No password field: the credential belongs to GitHub, not to this page. -->
<div id="login-overlay" class="login-overlay">
  <h2 class="login-title">Sign in to ArchGuard</h2>
  <p class="login-subtitle">
    Your analyses are private to your account.
  </p>
  <button id="sign-in-button" type="button" class="btn-login" hidden>
    Sign in with GitHub
  </button>
  <div id="login-error" class="login-error"></div>
</div>

<script src="/auth.js"></script>
    <div class="container" id="main-container">
        <div class="theme-switch-row">
            <div class="theme-switch" role="group" aria-label="Colour theme">
                <button type="button" class="theme-option" data-theme-value="light" aria-pressed="false" title="Light">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <span class="sr-only">Light</span>
                </button>
                <button type="button" class="theme-option" data-theme-value="dark" aria-pressed="true" title="Dark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
                    <span class="sr-only">Dark</span>
                </button>
            </div>
        </div>
        <div class="glass-card">
            <div class="header">
                <h1>ArchGuard</h1>
                <p>Advanced Architectural AI Intelligence</p>
            </div>

            <form id="submit-form">
                <div class="input-group">
                    <input type="url" id="github-url" placeholder="https://github.com/owner/repo" required autocomplete="off">
                    <div id="error-msg" class="error-message"></div>
                </div>

                <div id="repo-preview" class="repo-preview">
                    <div>
                        <div class="repo-name" id="preview-name">owner/repo</div>
                        <div class="repo-meta">
                            <span id="preview-lang">Python</span>
                            <span>★ <span id="preview-stars">0</span></span>
                        </div>
                    </div>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--success-color)"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </div>

                <button type="submit" id="btn-submit" class="btn-submit">Analyze Repository</button>
            </form>

            <div id="result-card" class="result-card">
                <div class="result-card-title">Analysis Complete</div>
                <div class="result-card-stats">
                    <div class="result-stat">
                        <span class="result-stat-val" id="res-score">--</span>
                        <span class="result-stat-label">Health Score</span>
                        <div id="res-fallback-warning" style="display: none; color: var(--warn-color); font-size: 0.75rem; margin-top: 4px; text-align: center;">
                            ⚠️ Shallow history fallback
                        </div>
                    </div>
                    <div class="result-stat">
                        <span class="result-stat-val" id="res-violations">--</span>
                        <span class="result-stat-label">Violations</span>
                    </div>
                </div>
                <div class="result-grade" id="res-grade">Grade: --</div>
            </div>

            <div id="terminal" class="terminal-container">
                <div class="terminal-header">
                    <div class="term-btn red"></div>
                    <div class="term-btn yellow"></div>
                    <div class="term-btn green"></div>
                </div>
                <div class="terminal-body" id="term-output">
                </div>
            </div>
        </div>
    </div>

    <script nonce="{{ csp_nonce }}" src="/index.js"></script>
</body>
</html>
