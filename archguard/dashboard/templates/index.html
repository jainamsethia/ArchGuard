<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchGuard - Job Submission</title>
    
    <link rel="stylesheet" href="/index.css"/>
</head>
<body class="page-index">

<!-- Login overlay — shown when token is required and no valid session cookie exists -->
<div id="login-overlay" style="display:none; position:fixed; inset:0; background:rgba(10,12,18,0.97);
     z-index:9999; flex-direction:column; align-items:center; justify-content:center; gap:1rem;">
  <h2 style="color:var(--text-primary); margin:0;">ArchGuard — Enter Token</h2>
  <p style="color:var(--text-secondary); margin:0; font-size:0.9rem;">
    This deployment requires a dashboard token to continue.
  </p>
  <form id="login-form" style="display:flex; flex-direction:column; gap:0.75rem; width:320px;">
    <input id="token-input" type="password" placeholder="Dashboard token"
           style="padding:0.75rem 1rem; border-radius:8px; border:1px solid var(--border-color);
                  background:rgba(255,255,255,0.05); color:var(--text-primary); font-size:1rem;"/>
    <button type="submit" class="btn-login">
      Sign In
    </button>
    <div id="login-error" style="color:var(--danger-color,#ef4444); font-size:0.85rem; display:none;"></div>
  </form>
</div>

<script src="/auth.js"></script>
    <div class="container" id="main-container">
        <div class="glass-card">
            <div class="header">
                <h1>ArchGuard</h1>
                <p>Advanced Architectural AI Intelligence</p>
            </div>

            <form id="submit-form">
                <div class="input-group">
                    <input type="url" id="github-url" placeholder="https://github.com/owner/repo" required autocomplete="off">
                    <div id="error-msg" class="error-message"></div>
                </div>

                <div id="repo-preview" class="repo-preview">
                    <div>
                        <div class="repo-name" id="preview-name">owner/repo</div>
                        <div class="repo-meta">
                            <span id="preview-lang">Python</span>
                            <span>★ <span id="preview-stars">0</span></span>
                        </div>
                    </div>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--success-color)"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </div>

                <button type="submit" id="btn-submit" class="btn-submit">Analyze Repository</button>
            </form>

            <div id="result-card" class="result-card">
                <div class="result-card-title">Analysis Complete</div>
                <div class="result-card-stats">
                    <div class="result-stat">
                        <span class="result-stat-val" id="res-score">--</span>
                        <span class="result-stat-label">Health Score</span>
                    </div>
                    <div class="result-stat">
                        <span class="result-stat-val" id="res-violations">--</span>
                        <span class="result-stat-label">Violations</span>
                    </div>
                </div>
                <div class="result-grade" id="res-grade">Grade: --</div>
            </div>

            <div id="terminal" class="terminal-container">
                <div class="terminal-header">
                    <div class="term-btn red"></div>
                    <div class="term-btn yellow"></div>
                    <div class="term-btn green"></div>
                </div>
                <div class="terminal-body" id="term-output">
                </div>
            </div>
        </div>
    </div>

    <script nonce="{{ csp_nonce }}" src="/index.js"></script>
</body>
</html>
