<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchGuard - Job Submission</title>
    <style>
        @font-face {
            font-family: 'Inter';
            src: url('/static/fonts/inter-variable.woff2') format('woff2');
            font-weight: 100 900;
            font-display: swap;
        }
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.15), transparent 40%),
                radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.15), transparent 40%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            box-sizing: border-box;
            transition: max-width 0.5s ease;
        }

        .container.expanded {
            max-width: 900px;
        }

        .glass-card {
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            font-size: 1.1rem;
            color: var(--text-primary);
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        .input-group input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .btn-submit {
            width: 100%;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: var(--accent-color);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
            font-family: 'Inter', sans-serif;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.6);
        }

        .btn-submit:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            color: #94a3b8;
        }

        .repo-preview {
            display: none;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: left;
            animation: fadeIn 0.4s ease-out;
        }

        .repo-preview.show {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .repo-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #e2e8f0;
        }

        .repo-meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            gap: 1rem;
            margin-top: 0.25rem;
        }

        /* Terminal Window */
        .terminal-container {
            display: none;
            margin-top: 2rem;
            background: #000;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: left;
            overflow: hidden;
            animation: slideDown 0.5s ease-out forwards;
        }

        .terminal-container.show {
            display: block;
        }

        .terminal-header {
            background: #1e1e1e;
            padding: 0.5rem 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .term-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .term-btn.red { background: #ff5f56; }
        .term-btn.yellow { background: #ffbd2e; }
        .term-btn.green { background: #27c93f; }

        .terminal-body {
            padding: 1.5rem;
            height: 300px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #a8cc8c;
            line-height: 1.6;
        }

        .terminal-line {
            margin-bottom: 0.25rem;
            word-break: break-all;
        }

        .terminal-line.error { color: #e88388; }
        .terminal-line.system { color: #71baf2; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 500px; }
        }

        .result-card {
            display: none;
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
            animation: slideDown 0.5s ease-out forwards;
        }

        .result-card.show {
            display: block;
        }

        .result-card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .result-card-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 0.5rem;
        }

        .result-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-stat-val {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .result-stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-grade {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.25rem 1rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1.1rem;
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .error-message {
            color: var(--danger-color);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
            text-align: left;
        }
        .error-message.show { display: block; }
        
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        @media (max-width: 480px) {
            #main-container {
                padding: 1rem;
            }

            /* Input + button row stacks vertically on mobile */
            .input-row {
                flex-direction: column;
            }
            .input-row input,
            .input-row button {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

<!-- Login overlay — shown when token is required and no valid session cookie exists -->
<div id="login-overlay" style="display:none; position:fixed; inset:0; background:rgba(10,12,18,0.97);
     z-index:9999; flex-direction:column; align-items:center; justify-content:center; gap:1rem;">
  <h2 style="color:var(--text-primary); margin:0;">ArchGuard — Enter Token</h2>
  <p style="color:var(--text-secondary); margin:0; font-size:0.9rem;">
    This deployment requires a dashboard token to continue.
  </p>
  <form id="login-form" style="display:flex; flex-direction:column; gap:0.75rem; width:320px;"
        onsubmit="doLogin(event)">
    <input id="token-input" type="password" placeholder="Dashboard token"
           style="padding:0.75rem 1rem; border-radius:8px; border:1px solid var(--border-color);
                  background:rgba(255,255,255,0.05); color:var(--text-primary); font-size:1rem;"/>
    <button type="submit"
            style="padding:0.75rem; border-radius:8px; background:var(--accent-color);
                   color:white; border:none; font-weight:600; cursor:pointer; font-size:1rem;">
      Sign In
    </button>
    <div id="login-error" style="color:var(--danger-color,#ef4444); font-size:0.85rem; display:none;"></div>
  </form>
</div>

<script>
(async function initAuth() {
  const res = await fetch('/api/auth/status');
  if (!res.ok) return;
  const { token_required, authenticated } = await res.json();
  if (token_required && !authenticated) {
    const overlay = document.getElementById('login-overlay');
    overlay.style.display = 'flex';
    document.querySelectorAll('body > *:not(#login-overlay)').forEach(el => el.style.visibility = 'hidden');
  }
})();

async function doLogin(event) {
  event.preventDefault();
  const token = document.getElementById('token-input').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  const fd = new FormData();
  fd.append('token', token);
  const res = await fetch('/api/auth/login', { method: 'POST', body: fd });
  if (res.ok) {
    document.getElementById('login-overlay').style.display = 'none';
    document.querySelectorAll('body > *:not(#login-overlay)').forEach(el => el.style.visibility = '');
  } else {
    errEl.textContent = 'Invalid token. Please try again.';
    errEl.style.display = 'block';
  }
}
</script>
    <div class="container" id="main-container">
        <div class="glass-card">
            <div class="header">
                <h1>ArchGuard</h1>
                <p>Advanced Architectural AI Intelligence</p>
            </div>

            <form id="submit-form" onsubmit="event.preventDefault(); handleSubmit();">
                <div class="input-group">
                    <input type="url" id="github-url" placeholder="https://github.com/owner/repo" required autocomplete="off">
                    <div id="error-msg" class="error-message"></div>
                </div>

                <div id="repo-preview" class="repo-preview">
                    <div>
                        <div class="repo-name" id="preview-name">owner/repo</div>
                        <div class="repo-meta">
                            <span id="preview-lang">Python</span>
                            <span>★ <span id="preview-stars">0</span></span>
                        </div>
                    </div>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--success-color)"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </div>

                <button type="submit" id="btn-submit" class="btn-submit">Analyze Repository</button>
            </form>

            <div id="result-card" class="result-card">
                <div class="result-card-title">Analysis Complete</div>
                <div class="result-card-stats">
                    <div class="result-stat">
                        <span class="result-stat-val" id="res-score">--</span>
                        <span class="result-stat-label">Health Score</span>
                    </div>
                    <div class="result-stat">
                        <span class="result-stat-val" id="res-violations">--</span>
                        <span class="result-stat-label">Violations</span>
                    </div>
                </div>
                <div class="result-grade" id="res-grade">Grade: --</div>
            </div>

            <div id="terminal" class="terminal-container">
                <div class="terminal-header">
                    <div class="term-btn red"></div>
                    <div class="term-btn yellow"></div>
                    <div class="term-btn green"></div>
                </div>
                <div class="terminal-body" id="term-output">
                </div>
            </div>
        </div>
    </div>

    <script nonce="{{ csp_nonce }}" src="/static/index.js"></script>
</body>
</html>
