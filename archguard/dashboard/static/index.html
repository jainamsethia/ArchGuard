<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://localhost:8000; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
    <title>ArchGuard - Job Submission</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.15), transparent 40%),
                radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.15), transparent 40%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            box-sizing: border-box;
            transition: max-width 0.5s ease;
        }

        .container.expanded {
            max-width: 900px;
        }

        .glass-card {
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            font-size: 1.1rem;
            color: var(--text-primary);
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        .input-group input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .btn-submit {
            width: 100%;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: var(--accent-color);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
            font-family: 'Inter', sans-serif;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.6);
        }

        .btn-submit:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            color: #94a3b8;
        }

        .repo-preview {
            display: none;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: left;
            animation: fadeIn 0.4s ease-out;
        }

        .repo-preview.show {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .repo-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #e2e8f0;
        }

        .repo-meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            gap: 1rem;
            margin-top: 0.25rem;
        }

        /* Terminal Window */
        .terminal-container {
            display: none;
            margin-top: 2rem;
            background: #000;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: left;
            overflow: hidden;
            animation: slideDown 0.5s ease-out forwards;
        }

        .terminal-container.show {
            display: block;
        }

        .terminal-header {
            background: #1e1e1e;
            padding: 0.5rem 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .term-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .term-btn.red { background: #ff5f56; }
        .term-btn.yellow { background: #ffbd2e; }
        .term-btn.green { background: #27c93f; }

        .terminal-body {
            padding: 1.5rem;
            height: 300px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #a8cc8c;
            line-height: 1.6;
        }

        .terminal-line {
            margin-bottom: 0.25rem;
            word-break: break-all;
        }

        .terminal-line.error { color: #e88388; }
        .terminal-line.system { color: #71baf2; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 500px; }
        }

        .error-message {
            color: var(--danger-color);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
            text-align: left;
        }
        .error-message.show { display: block; }
        
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div class="glass-card">
            <div class="header">
                <h1>ArchGuard</h1>
                <p>Advanced Architectural AI Intelligence</p>
            </div>

            <form id="submit-form" onsubmit="event.preventDefault(); handleSubmit();">
                <div class="input-group">
                    <input type="url" id="github-url" placeholder="https://github.com/owner/repo" required autocomplete="off">
                    <div id="error-msg" class="error-message"></div>
                </div>

                <div id="repo-preview" class="repo-preview">
                    <div>
                        <div class="repo-name" id="preview-name">owner/repo</div>
                        <div class="repo-meta">
                            <span id="preview-lang">Python</span>
                            <span>★ <span id="preview-stars">0</span></span>
                        </div>
                    </div>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--success-color)"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </div>

                <button type="submit" id="btn-submit" class="btn-submit">Analyze Repository</button>
            </form>

            <div id="terminal" class="terminal-container">
                <div class="terminal-header">
                    <div class="term-btn red"></div>
                    <div class="term-btn yellow"></div>
                    <div class="term-btn green"></div>
                </div>
                <div class="terminal-body" id="term-output">
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('github-url');
        const submitBtn = document.getElementById('btn-submit');
        const errorMsg = document.getElementById('error-msg');
        const repoPreview = document.getElementById('repo-preview');
        const terminal = document.getElementById('terminal');
        const termOutput = document.getElementById('term-output');
        const container = document.getElementById('main-container');

        let isValidating = false;
        let isJobRunning = false;

        // Auto-validate URL when user finishes typing
        let debounceTimer;
        urlInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            repoPreview.classList.remove('show');
            errorMsg.classList.remove('show');
            
            const url = urlInput.value.trim();
            if (url && url.includes('github.com')) {
                debounceTimer = setTimeout(() => validateUrl(url), 800);
            }
        });

        async function validateUrl(url) {
            if (isJobRunning) return;
            
            isValidating = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Validating...';
            errorMsg.classList.remove('show');

            try {
                const res = await fetch('/api/jobs/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ github_url: url })
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || 'Validation failed');
                }

                const data = await res.json();
                document.getElementById('preview-name').textContent = data.full_name;
                document.getElementById('preview-lang').textContent = data.language || 'Unknown';
                document.getElementById('preview-stars').textContent = data.stars;
                
                repoPreview.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Start Analysis';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.add('show');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Analyze Repository';
            } finally {
                isValidating = false;
            }
        }

        function appendLog(msg, type = '') {
            const line = document.createElement('div');
            line.className = `terminal-line ${type}`;
            const timestamp = new Date().toISOString().split('T')[1].substring(0, 8);
            line.textContent = `[${timestamp}] ${msg}`;
            termOutput.appendChild(line);
            termOutput.scrollTop = termOutput.scrollHeight;
        }

        async function handleSubmit() {
            const url = urlInput.value.trim();
            if (!url || isJobRunning || isValidating) return;

            isJobRunning = true;
            urlInput.disabled = true;
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Analyzing<span class="loading-dots"></span>';
            
            // Show terminal
            container.classList.add('expanded');
            terminal.classList.add('show');
            termOutput.innerHTML = '';
            appendLog('Initializing ArchGuard pipeline...', 'system');
            appendLog(`Target repository: ${url}`, 'system');

            try {
                // Submit job
                const res = await fetch('/api/jobs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ github_url: url })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Failed to submit job');
                }

                const data = await res.json();
                const jobId = data.job_id;
                appendLog(`Job queued. ID: ${jobId}`, 'system');
                appendLog('Establishing secure stream connection...', 'system');

                // Connect to SSE stream
                const evtSource = new EventSource(`/api/jobs/${jobId}/stream`);
                
                evtSource.onmessage = function(event) {
                    const payload = JSON.parse(event.data);
                    
                    if (payload.type === 'progress') {
                        appendLog(payload.message);
                    } 
                    else if (payload.type === 'error') {
                        appendLog(`ERROR: ${payload.error}`, 'error');
                        submitBtn.textContent = 'Analysis Failed';
                        evtSource.close();
                    }
                    else if (payload.type === 'done') {
                        appendLog('Pipeline finished. Generating dashboard...', 'system');
                        evtSource.close();
                        setTimeout(() => {
                            window.location.href = `dashboard.html?job_id=${jobId}`;
                        }, 1500);
                    }
                };

                evtSource.onerror = function(err) {
                    appendLog('Stream connection lost. Reconnecting...', 'error');
                };

            } catch (err) {
                appendLog(`Failed to start analysis: ${err.message}`, 'error');
                submitBtn.textContent = 'Submission Error';
                urlInput.disabled = false;
                isJobRunning = false;
            }
        }
    </script>
</body>
</html>
