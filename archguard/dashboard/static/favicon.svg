<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ArchGuard">
  <!-- A shield holding three stacked layers: the architecture being guarded.
       SVG rather than ICO so it scales, respects the browser's dark mode, and
       is one reviewable file instead of a binary blob. -->
  <style>
    .plate { fill: #0071e3; }
    .layer { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #0a84ff; }
    }
  </style>
  <path class="plate" d="M16 1.5 3.5 6.2v9.1c0 7.4 5.2 14.2 12.5 16.2 7.3-2 12.5-8.8 12.5-16.2V6.2z"/>
  <rect class="layer" x="9"  y="10" width="14" height="2.6" rx="1.3"/>
  <rect class="layer" x="9"  y="15" width="10" height="2.6" rx="1.3"/>
  <rect class="layer" x="9"  y="20" width="6"  height="2.6" rx="1.3"/>
</svg>
