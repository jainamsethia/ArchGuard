version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: archguard:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Set ARCHGUARD_DASHBOARD_TOKEN in your .env file before exposing this
      # service remotely.  ARCHGUARD_DASHBOARD_ALLOW_REMOTE is intentionally
      # NOT set here — enabling unauthenticated remote access requires an
      # explicit decision in .env, not a default.
      - ENVIRONMENT=development
    volumes:
      # Persistent storage for audit log and cache between runs
      - archguard-cache:/home/archguard/.archguard-cache
    tmpfs:
      # Isolated in-memory temp space for git clone workspaces.
      # Size limit prevents disk exhaustion from large repos.
      - /tmp:size=2g,mode=1777
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  archguard-cache:
    driver: local
