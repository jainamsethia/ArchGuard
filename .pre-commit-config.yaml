repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      # No --unsafe-fixes. Ruff's own definition of an unsafe fix is one that
      # may change behaviour; applying those automatically on every commit is
      # how a fixture repo's deliberately-planted violations got "fixed" away.
      # Rule selection lives in pyproject.toml [tool.ruff], not here.
      - id: ruff
        args: [--fix]
      # ruff-format is deliberately NOT enabled: 80 of 131 source files predate
      # it, so turning it on here makes the next contributor's first commit a
      # whole-repo reformat. Adopt it as its own standalone commit, then add
      # `- id: ruff-format` here and a `ruff format --check` step to CI.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-requests, typer, watchdog, fastapi]
        exclude: ^tests/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$
