name: Publish (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Must match pyproject.toml.'
        required: true
        type: string
      publish-pypi:
        description: 'Publish to PyPI'
        type: boolean
        default: false
      publish-docker:
        description: 'Build and push Docker image to GHCR'
        type: boolean
        default: false

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches pyproject.toml
        run: |
          TOML_VERSION=$(python3 -c "import tomllib; d=tomllib.loads(open('pyproject.toml','rb').read()); print(d['tool']['poetry']['version'])")
          if [[ "${{ inputs.version }}" != "${TOML_VERSION}" ]]; then
            echo "Input version ${{ inputs.version }} != pyproject.toml ${TOML_VERSION}"
            exit 1
          fi
          echo "Version ${TOML_VERSION} validated."

  publish-pypi:
    name: Publish to PyPI
    needs: validate
    if: ${{ inputs.publish-pypi == true }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install poetry
      - run: poetry build
      - run: poetry publish --no-interaction
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}

  publish-docker:
    name: Build and Push Docker Image
    needs: validate
    if: ${{ inputs.publish-docker == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/archguard:latest
            ghcr.io/${{ github.repository_owner }}/archguard:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
