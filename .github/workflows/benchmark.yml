name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    name: Latency Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install "poetry==2.4.1"
          poetry install --with dev

      - name: Run benchmarks
        run: |
          poetry run pytest tests/benchmarks/ --no-cov --benchmark-json=.benchmarks/current.json
          poetry run python scripts/check_benchmarks.py .benchmarks/current.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: .benchmarks/
