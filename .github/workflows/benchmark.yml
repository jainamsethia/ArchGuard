name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    name: Latency Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e ".[dev]"

      - name: Run benchmarks
        run: |
          if [ -f .benchmarks/baseline.json ]; then
            pytest tests/benchmarks/ --benchmark-json=.benchmarks/current.json
            python scripts/check_benchmarks.py --baseline .benchmarks/baseline.json --current .benchmarks/current.json
          else
            echo "No baseline found. Generating baseline for future runs."
            pytest tests/benchmarks/ --benchmark-json=.benchmarks/baseline.json
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: .benchmarks/
