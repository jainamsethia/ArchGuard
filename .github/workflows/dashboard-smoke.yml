name: Dashboard Smoke Test (Token-Auth)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t archguard:ci .

  dashboard-smoke:
    needs: [docker-build]
    runs-on: ubuntu-latest
    env:
      ARCHGUARD_DASHBOARD_TOKEN: ci-test-token
      ARCHGUARD_DASHBOARD_ALLOW_REMOTE: ""
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t archguard:ci .

      - name: Start dashboard container with token auth
        run: |
          docker run -d --name archguard-smoke \
            -p 8765:8000 \
            -e ARCHGUARD_DASHBOARD_TOKEN=$ARCHGUARD_DASHBOARD_TOKEN \
            -e ARCHGUARD_MOCK_LLM=1 \
            archguard:ci
          sleep 5

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8765/health && break
            sleep 2
          done

      - name: Test auth/login returns OK
        run: |
          RESULT=$(curl -sf -c /tmp/cookies.txt \
            -d "token=ci-test-token" \
            http://localhost:8765/api/auth/login)
          echo "Login response: $RESULT"
          echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') == True, f'Login failed: {d}'"

      - name: Test job-status with auth cookie returns 404 not 500 (CRIT-04 regression)
        run: |
          STATUS=$(curl -sf -b /tmp/cookies.txt \
            "http://localhost:8765/api/jobs/00000000-0000-0000-0000-000000000001")
          echo "Job status response: $STATUS"
          echo "$STATUS" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert 'Internal server error' not in d.get('error', ''), f'Got 500: {d}'
          assert 'NameError' not in str(d), f'Got NameError: {d}'
          print('CRIT-04 regression: PASS')
          "

      - name: Test dashboard.html loads with 200 and nonce (CRIT-03 regression)
        run: |
          HTTP_STATUS=$(curl -sw '%{http_code}' -o /tmp/dashboard_body.html \
            http://localhost:8765/dashboard.html)
          echo "dashboard.html HTTP status: $HTTP_STATUS"
          [ "$HTTP_STATUS" = "200" ]
          grep -q 'nonce=' /tmp/dashboard_body.html && echo "Nonce found: PASS" || (echo "Nonce not found: FAIL" && exit 1)

      - name: Test unauthenticated request is rejected
        run: |
          HTTP_STATUS=$(curl -sw '%{http_code}' -o /dev/null \
            http://localhost:8765/api/runs/latest)
          echo "Unauthenticated /api/runs/latest: $HTTP_STATUS"
          [ "$HTTP_STATUS" = "401" ]

      - name: Test frontend login via headless browser (SEED-01 regression)
        run: |
          pip3 install playwright
          playwright install chromium --with-deps
          python3 -c "
          from playwright.sync_api import sync_playwright
          import os
          
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('http://localhost:8765/')
              
              page.wait_for_selector('#login-overlay', state='visible')
              page.fill('#token-input', os.environ['ARCHGUARD_DASHBOARD_TOKEN'])
              page.click('button.btn-login')
              
              page.wait_for_selector('#login-overlay', state='hidden')
              page.wait_for_selector('#main-container', state='visible')
              
              cookies = page.context.cookies()
              auth_cookie = next((c for c in cookies if c['name'] == 'archguard_session'), None)
              assert auth_cookie is not None, 'No archguard_session cookie found'
              print('SEED-01 regression: PASS')
              browser.close()
          "

      - name: Test backend returns honest 404/empty state instead of global data (SEED-02 regression)
        run: |
          curl -sf -b /tmp/cookies.txt -X POST -H "Content-Type: application/json" \
            -d '{"github_url": "https://github.com/pypa/sampleproject"}' \
            http://localhost:8765/api/v1/jobs > /dev/null
          curl -sf -b /tmp/cookies.txt -X POST -H "Content-Type: application/json" \
            -d '{"github_url": "https://github.com/psf/requests"}' \
            http://localhost:8765/api/v1/jobs > /dev/null
            
          sleep 3
          
          HTTP_STATUS=$(curl -sw '%{http_code}' -b /tmp/cookies.txt -o /dev/null \
            "http://localhost:8765/api/v1/runs/latest?job_id=00000000-0000-0000-0000-123456789abc")
          echo "Fabricated job_id HTTP status: $HTTP_STATUS"
          [ "$HTTP_STATUS" = "404" ] || (echo "FAIL: Expected 404, got $HTTP_STATUS" && exit 1)
          
          RESPONSE=$(curl -sf -b /tmp/cookies.txt "http://localhost:8765/api/v1/runs/latest")
          echo "No job_id response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('empty') == True, f'Expected empty state, got {d}'"
          
          echo "SEED-02 regression: PASS"

      - name: Cleanup
        if: always()
        run: docker rm -f archguard-smoke || true
