name: E2E Self-Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for co-change analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install archguard (base)
        run: |
          pip install "poetry==2.4.1"
          poetry install

      - name: Validate contract schema
        run: poetry run archguard status
        env:
          ARCHGUARD_SKIP_ML: "1"

      - name: Run archguard analyze (dry-run, no ML)
        run: poetry run archguard analyze --dry-run --repo . --skip-explanation
        env:
          ARCHGUARD_AUDIT_STRICT: "1"
          ARCHGUARD_SKIP_ML: "1"

      - name: Install archguard (with ML extras)
        run: poetry install --with ml

      - name: Run archguard init (dry-run)
        run: poetry run archguard init --dry-run --repo .

      - name: Run archguard analyze (with ML, skip LLM)
        run: poetry run archguard analyze --dry-run --repo . --skip-explanation
        env:
          ARCHGUARD_AUDIT_STRICT: "1"
          ARCHGUARD_SKIP_ML: "1"
