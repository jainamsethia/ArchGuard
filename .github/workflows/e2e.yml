name: E2E Self-Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for co-change analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install archguard (base)
        run: pip install -e .

      - name: Validate contract schema
        run: archguard status

      - name: Run archguard analyze (dry-run, no ML)
        run: archguard analyze --dry-run --repo . --skip-explanation
        env:
          ARCHGUARD_AUDIT_STRICT: "1"
          ARCHGUARD_SKIP_ML: "true"

      - name: Install archguard (with ML extras)
        run: pip install -e ".[ml]"

      - name: Run archguard init (dry-run)
        run: archguard init --dry-run --repo .

      - name: Run archguard analyze (with ML)
        run: archguard analyze --dry-run --repo .
        env:
          ARCHGUARD_AUDIT_STRICT: "1"
          ARCHGUARD_SKIP_LLM: "true"  # Don't need API key in CI
