name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev
      - name: Run ruff
        run: poetry run ruff check archguard/
      - name: Run mypy
        run: poetry run mypy archguard/ --ignore-missing-imports
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './action'

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install poetry && poetry install
      - name: Safety check
        run: |
          poetry run pip-audit --output=json --format=json \
            || true  # warn but don't block until triaged
        # NOTE: Replace || true with hard fail after triage

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install poetry && poetry install --with dev
      - name: Run unit tests
        run: |
          poetry run pytest tests/unit/ \
            --cov=archguard \
            --cov-report=xml \
            --cov-fail-under=70  # increase progressively to 85
        env:
          ARCHGUARD_TEST_MODE: "1"
      - name: Run integration tests  
        run: |
          poetry run pytest tests/integration/ -v \
            --timeout=60
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARCHGUARD_MOCK_LLM: "1"  # use mock LLM in tests
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
