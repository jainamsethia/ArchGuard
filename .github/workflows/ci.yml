name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install "poetry==2.4.1"
          poetry install --with dev
      # tests/ and scripts/ are linted too: a test that binds a mock it never
      # asserts on, or shells out without checking the exit code, is exactly
      # the kind of test that passes while checking nothing. Rule selection
      # lives in pyproject.toml [tool.ruff]; tests/fixtures is force-excluded
      # there because its planted violations are the thing under test.
      - name: Run ruff
        run: poetry run ruff check archguard/ tests/ scripts/
      - name: Run mypy
        run: poetry run mypy archguard/ --ignore-missing-imports
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies (with dev, all extras — so scans see every requirement)
        run: pip install "poetry==2.4.1" && poetry install --with dev --all-extras
      - name: Security audit
        run: |
          poetry run pip-audit --ignore-vuln PYSEC-2026-196 --format=json --output=audit-results.json
        # Hard fail — no || true. Triage has been completed.
      - name: SAST scan (bandit)
        run: poetry run bandit -r archguard/ -ll
        # -ll = medium severity and above. Hard fail on any finding.

      - name: Archive bandit report
        if: always()
        run: poetry run bandit -r archguard/ -ll --format json -o bandit-results.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-scan
          path: bandit-results.json
          retention-days: 30
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: audit-results.json
          retention-days: 30

  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install "poetry==2.4.1" && poetry install --with dev
      - name: Verify test collection
        run: poetry run pytest tests/unit/ --co -q 2>&1 | tail -5
      - name: Run unit and integration tests
        run: |
          poetry run pytest tests/unit/ tests/integration/ \
            --cov-report=xml \
            --timeout=120 \
            -m "not slow"
        env:
          ARCHGUARD_TEST_MODE: "1"
          ARCHGUARD_SKIP_ML: "1"
          ARCHGUARD_MOCK_LLM: "1"
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
      - name: Smoke test
        run: |
          poetry run uvicorn archguard.dashboard.app:app --host 0.0.0.0 --port 8000 &
          sleep 3
          ./scripts/smoke_test.sh

  docker-build:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create .env for build test
        run: |
          cp .env.example .env
          # Override to allow remote access in CI without a token
          echo "ARCHGUARD_DASHBOARD_ALLOW_REMOTE=1" >> .env
          echo "ARCHGUARD_SKIP_ML=1" >> .env
          echo "ARCHGUARD_SKIP_LLM=1" >> .env
      - name: Build Docker image
        run: docker build -t archguard:ci .
      - name: Start container and verify /health
        run: |
          docker run --rm -d \
            --name archguard-ci-test \
            -p 8000:8000 \
            -e ARCHGUARD_DASHBOARD_ALLOW_REMOTE=1 \
            -e ARCHGUARD_SKIP_ML=1 \
            -e ARCHGUARD_SKIP_LLM=1 \
            archguard:ci
          
          # Wait for the app to be ready (max 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Health check passed after ${i}s"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 1
          done
          
          # Fail if health check never passed
          curl -sf http://localhost:8000/health | python3 -m json.tool
      - name: Stop container
        if: always()
        run: docker stop archguard-ci-test 2>/dev/null || true
      - name: Upload Docker image digest
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Image built successfully on main branch"
          docker inspect archguard:ci --format='{{.Id}}' > image-digest.txt
          cat image-digest.txt
      - name: Upload image digest artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-digest
          path: image-digest.txt
          retention-days: 7

  visual-regression:
    needs: [docker-build]
    runs-on: ubuntu-latest
    continue-on-error: true  # TODO(U-CRIT-07): remove once cross-platform test baselines are verified green on 3 consecutive runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run visual regression tests
        run: npx playwright test tests/visual/
      - name: Upload diff artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: test-results/
