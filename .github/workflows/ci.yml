name: CI

on:
  push:
    # `claude/**` so a branch can be validated on its own merits. A
    # `pull_request` run checks out `refs/pull/N/merge`, the test merge of head
    # into base -- so a PR that conflicts with its base has no such ref and
    # never queues a run at all. Waiting on the PR therefore reports nothing,
    # not a failure, which is the most misleading of the two.
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install "poetry==2.4.1"
          poetry install --with dev
      # tests/ and scripts/ are linted too: a test that binds a mock it never
      # asserts on, or shells out without checking the exit code, is exactly
      # the kind of test that passes while checking nothing. Rule selection
      # lives in pyproject.toml [tool.ruff]; tests/fixtures is force-excluded
      # there because its planted violations are the thing under test.
      - name: Run ruff
        run: poetry run ruff check archguard/ tests/ scripts/
      - name: Run mypy
        run: poetry run mypy archguard/ --ignore-missing-imports
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies (with dev, all extras — so scans see every requirement)
        run: pip install "poetry==2.4.1" && poetry install --with dev --all-extras

      # pip-audit reports on every distribution in the environment, and pip is
      # one of them: 26.1.1 carries PYSEC-2026-3721. Upgraded rather than
      # ignored, because an ignore entry for the tool's own installer would sit
      # there long after the advisory stopped mattering. Inside `poetry run`,
      # because that is the environment being audited.
      - name: Upgrade pip in the audited environment
        run: poetry run python -m pip install --upgrade pip

      - name: Security audit
        run: |
          poetry run pip-audit --ignore-vuln PYSEC-2026-196 --format=json --output=audit-results.json
        # Hard fail — no || true. Triage has been completed.
      - name: SAST scan (bandit)
        run: poetry run bandit -r archguard/ -ll
        # -ll = medium severity and above. Hard fail on any finding.

      - name: Archive bandit report
        if: always()
        run: poetry run bandit -r archguard/ -ll --format json -o bandit-results.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-scan
          path: bandit-results.json
          retention-days: 30
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: audit-results.json
          retention-days: 30

  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Real PostgreSQL and real Redis, because that is what the application
    # requires. Every dashboard read is a query and every session is a Redis
    # key: without these the tests that matter most skip, and a suite that
    # skips its way to green is worse than one that fails.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: archguard
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: archguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U archguard -d archguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # 127.0.0.1, never localhost: where localhost resolves to ::1 first and
      # nothing listens on IPv6, every connection waits out the failed attempt.
      # Measured locally at 2.13s per connect versus 0.09s — enough to turn a
      # three-minute suite into ninety minutes, with nothing in the output
      # saying why.
      DATABASE_URL: postgresql+asyncpg://archguard:ci_local_only@127.0.0.1:5432/archguard_test
      TEST_DATABASE_URL: postgresql+asyncpg://archguard:ci_local_only@127.0.0.1:5432/archguard_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SESSION_SECRET: ci-session-secret-not-used-anywhere-real-0123456789
      ARCHGUARD_SKIP_ML: "1"
      ARCHGUARD_MOCK_LLM: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install "poetry==2.4.1" && poetry install --with dev
      - name: Verify test collection
        run: poetry run pytest tests/unit/ --co -q 2>&1 | tail -5

      # Fails the build if any test skipped for want of a database. The point
      # of running the services is that these tests run; a silent skip would
      # make the job green while covering none of the persistence layer.
      - name: Assert the database-backed tests are not skipping
        run: |
          poetry run python - <<'PY'
          import os, sys
          for var in ("TEST_DATABASE_URL", "REDIS_URL"):
              if not os.environ.get(var):
                  sys.exit(f"{var} is unset; the integration tests would skip")
          print("database and redis configured")
          PY

      - name: Run unit and integration tests
        run: |
          poetry run pytest tests/unit/ tests/integration/ \
            --cov-branch \
            --cov-report=xml \
            --timeout=300 \
            -m "not slow"

      - name: Run the integration-marked tests
        run: poetry run pytest tests/unit/ tests/integration/ -m "integration" --no-cov

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  # Layers 3 and 4 need torch, sentence-transformers and faiss, which the job
  # above deliberately does not install: they are the worker image's
  # dependencies, they weigh more than everything else combined, and putting
  # them on a two-version matrix would pay that cost four times.
  #
  # The consequence had been that nothing ever exercised them. `test` sets
  # ARCHGUARD_SKIP_ML=1, so every ML-gated test skipped and the job went green
  # having covered neither layer -- which is how a Layer 4 defect survived into
  # a release. A skip that nobody is told about is indistinguishable from a
  # pass. So: one dedicated job, one Python version, real extras, and an
  # explicit assertion that the tests actually ran.
  ml:
    name: Layer 3 & 4 (worker extras)
    runs-on: ubuntu-latest

    # Layer 4's incremental tests read runs back out of PostgreSQL, because the
    # defect they cover lives in what one scan carries forward from the last.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: archguard
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: archguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U archguard -d archguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://archguard:ci_local_only@127.0.0.1:5432/archguard_test
      TEST_DATABASE_URL: postgresql+asyncpg://archguard:ci_local_only@127.0.0.1:5432/archguard_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SESSION_SECRET: ci-session-secret-not-used-anywhere-real-0123456789
      ARCHGUARD_MOCK_LLM: "1"
      # Deliberately NOT setting ARCHGUARD_SKIP_ML. That variable is the whole
      # reason this job exists; setting it here would make the job a no-op that
      # looks like coverage.

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with the worker extras
        run: pip install "poetry==2.4.1" && poetry install --with dev --extras worker

      # The model is downloaded on first use, inside whichever test happens to
      # touch Layer 3 first. Cached and fetched up front instead, so a Hugging
      # Face outage fails here with an obvious message rather than surfacing as
      # an unrelated-looking test error several minutes in.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Fetch the embedding model
        run: |
          poetry run python -c "
          from sentence_transformers import SentenceTransformer
          SentenceTransformer('all-MiniLM-L6-v2')
          print('all-MiniLM-L6-v2 ready')
          "

      # Without this, an extras install that quietly failed would leave every
      # ML test skipping and the job green -- exactly the failure being fixed.
      - name: Assert the ML extras are actually importable
        run: |
          poetry run python - <<'PY'
          import os, sys
          if os.environ.get("ARCHGUARD_SKIP_ML") == "1":
              sys.exit("ARCHGUARD_SKIP_ML is set; this job would test nothing")
          missing = []
          for mod in ("faiss", "sentence_transformers", "torch", "numpy", "scipy"):
              try:
                  __import__(mod)
              except Exception as exc:
                  missing.append(f"{mod} ({type(exc).__name__})")
          if missing:
              sys.exit("worker extras missing: " + ", ".join(missing))
          print("layers 3 and 4 can run")
          PY

      # The whole suite, with the slow layers switched on. Narrowing this to
      # the Layer 4 files by name would leave the next ML-gated test to be
      # written skipping unnoticed, which is the class of problem being closed.
      - name: Run the suite with layers 3 and 4 enabled
        run: |
          poetry run pytest tests/unit/ tests/integration/             --timeout=900             --no-cov             -m "integration or not integration"             -rs             --junitxml=ml-results.xml

      # Belt and braces: the step above fails on a failing test, this one fails
      # on a test that quietly stopped running.
      - name: Assert no test skipped for want of ML
        run: |
          poetry run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("ml-results.xml").getroot()
          bad = []
          for case in root.iter("testcase"):
              for skip in case.iter("skipped"):
                  reason = (skip.get("message") or "") + (skip.text or "")
                  low = reason.lower()
                  # "ML extras installed; this asserts the no-ML path" is the
                  # inverse test in test_fixture_correctness.py -- it is
                  # SUPPOSED to skip here, and skipping is how it passes.
                  if "ml extras installed" in low:
                      continue
                  if "ml extras" in low or "sentence-transformers" in low or "faiss" in low:
                      bad.append(f"{case.get('classname')}::{case.get('name')} -- {reason.strip()}")
          if bad:
              print("These tests skipped for want of ML in the job that exists to run them:")
              for line in bad:
                  print("  " + line)
              sys.exit(1)
          print("no ML-gated test skipped")
          PY

      # ArchGuard, analysed by ArchGuard, against the .archguard.yml in this
      # repository. Two pre-release gates used to do this through the CLI; it
      # was deleted and nothing replaced it, so the product stopped checking
      # itself.
      #
      # In this job specifically because it is the one with the worker extras
      # installed and ARCHGUARD_SKIP_ML deliberately unset. Anywhere else, two
      # of the four layers would report themselves unmeasured and the gate
      # would be grading half a repository.
      #
      # Not advisory. A failure here means the repository breached its own
      # fail_threshold or a fitness gate its own contract marks critical.
      - name: Release gate (ArchGuard analyses itself)
        run: poetry run python -m archguard.release_gate

      - name: Record the release gate result
        if: always()
        run: |
          poetry run python -m archguard.release_gate --json > release-gate.json || true
          cat release-gate.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate
          path: release-gate.json

  migrations:
    name: Alembic round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: archguard
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: archguard_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U archguard -d archguard_migrations"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://archguard:ci_local_only@127.0.0.1:5432/archguard_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "poetry==2.4.1" && poetry config virtualenvs.in-project true && poetry install --with dev

      # A downgrade that does not drop what the upgrade created leaves the
      # second upgrade failing on objects that already exist -- discovered
      # during a rollback, at the worst possible moment.
      - name: upgrade -> downgrade -> upgrade
        run: |
          poetry run alembic upgrade head
          poetry run alembic downgrade base
          poetry run alembic upgrade head

      # Fails when a model has drifted from the migrations, which otherwise
      # surfaces as a column that exists in dev and not in production.
      - name: alembic check (no model drift)
        run: poetry run alembic check

  frontend:
    name: Frontend (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 24, not 20, and this job is why. jsdom reaches html-encoding-sniffer,
      # which now requires @exodus/bytes -- an ESM-only package. `require()` of
      # ESM is a hard ERR_REQUIRE_ESM before Node 22.12, so on 20 every one of
      # these files failed to load and the suite reported eight failures that
      # were one unsupported runtime. Node 20 also reached end of life in April
      # 2026; the runner already warns that it is forcing actions off it.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      # dashboard.js was 2,000 untested lines. C3 (the compare button was
      # permanently disabled) and C4 (the empty state destroyed the page) are
      # both exactly what a jsdom test catches, and both shipped.
      - name: Run frontend tests
        run: npm test

  docker:
    name: Docker (web / worker split)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the web image
        run: docker build --target web -t archguard:web .

      # The whole point of the split. torch alone is larger than everything
      # else combined and the web process never loads a model, so an extra
      # landing in the wrong list costs multiple gigabytes and a cold start --
      # and looks like nothing until the image is built.
      - name: The web image must NOT contain torch
        run: |
          if docker run --rm archguard:web python -c "import torch" 2>/dev/null; then
            echo "::error::torch is present in the web image; the worker extra has leaked into it"
            exit 1
          fi
          echo "torch is absent from the web image, as intended"

      # The other half of the split, and the half nobody was checking. C2 was
      # that pip-audit was missing from every deployed image; the fix installed
      # it into the worker while the call stayed in the web request handler, so
      # the endpoint went on answering "pip-audit not found in PATH". Asserting
      # only that the worker has it proves the package exists somewhere, which
      # was never the question. The scan runs in the worker now, so the web
      # image must not carry it -- if it does, someone has moved the call back.
      - name: The web image must NOT contain pip-audit
        run: |
          if docker run --rm archguard:web pip-audit --version >/dev/null 2>&1; then
            echo "::error::pip-audit is in the web image; the dependency scan belongs to the worker"
            exit 1
          fi
          echo "pip-audit is absent from the web image, as intended"

      - name: The web image must still import the app
        run: docker run --rm archguard:web python -c "import archguard.dashboard.app"

      - name: Start the web image and verify /health
        run: |
          docker run --rm -d --name archguard-ci-web -p 8000:8000 \
            -e ARCHGUARD_DASHBOARD_ALLOW_REMOTE=1 \
            -e ARCHGUARD_SKIP_ML=1 \
            archguard:web
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/health | python3 -m json.tool
      - name: Smoke test the running image
        run: BASE_URL=http://localhost:8000 ./scripts/smoke_test.sh
      # The container has no database or Redis, so readiness must say so. A
      # /ready that returns 200 here would mean it is checking nothing.
      - name: /ready must report 503 with no backing services
        run: |
          code=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:8000/ready)
          cat /tmp/ready.json
          test "$code" = "503" || { echo "::error::/ready returned $code with no database"; exit 1; }
      - name: /metrics must answer even with no database
        run: |
          curl -sf http://localhost:8000/metrics | grep -q "archguard_database_up 0"
      - name: Stop the container
        if: always()
        run: docker stop archguard-ci-web 2>/dev/null || true

      - name: Build the worker image
        run: docker build --target worker -t archguard:worker .

      # C2. pip-audit was a dev-group dependency, so "Scan Dependencies"
      # answered "pip-audit not found in PATH" in every deployed environment --
      # a shipped feature that had never once worked in production.
      - name: The worker image must have pip-audit on PATH
        run: docker run --rm archguard:worker pip-audit --version

      # `--version` proves the package installed, not that the scan works. This
      # runs the real code path -- analyze_dependencies over a requirements
      # file -- inside the worker image, and fails if it comes back skipped,
      # which is what "pip-audit not found in PATH" would look like.
      - name: The worker image must be able to run a dependency scan
        run: |
          mkdir -p /tmp/depscan
          echo 'urllib3==1.24.1' > /tmp/depscan/requirements.txt
          docker run --rm -v /tmp/depscan:/scan:ro archguard:worker             python -c 'import pathlib, sys; from archguard.analysis.deps import analyze_dependencies; r = analyze_dependencies(pathlib.Path("/scan"), timeout=180); print("skipped:", r.skipped, "| reason:", r.skip_reason); sys.exit("pip-audit is not runnable inside the worker image") if r.skipped and "not found" in (r.skip_reason or "") else print("the worker image can run a dependency scan")'

      # Downloading ~90 MB from HuggingFace at request time into an ephemeral
      # layer meant every replaced container paid for it again, and failed
      # outright wherever egress is restricted. --network none proves the model
      # is really in the image rather than merely cached on the runner.
      - name: The worker image must load the model with no network
        run: |
          docker run --rm --network none archguard:worker python -c \
            "from sentence_transformers import SentenceTransformer; \
             SentenceTransformer('all-MiniLM-L6-v2'); print('model loaded offline')"

      - name: The worker image must be able to start its queue consumer
        run: docker run --rm archguard:worker arq --help

      # Render builds a Dockerfile path without naming a build stage, so its
      # worker service selects the image through this build argument instead.
      # Nothing else exercises that path, and if it silently produced the web
      # image the worker would come up without torch, faiss or pip-audit and
      # simply skip Layers 3 and 4 -- a degraded deployment that looks healthy.
      - name: The build argument must select the worker image too
        run: |
          docker build --build-arg ARCHGUARD_IMAGE=worker -t archguard:worker-by-arg .
          docker run --rm archguard:worker-by-arg pip-audit --version
          docker run --rm archguard:worker-by-arg python -c "import torch, faiss"
          echo "ARCHGUARD_IMAGE=worker selects the worker image"

      # ...and the default must stay the slim one, or a bare `docker build .`
      # starts producing the multi-gigabyte image for everyone.
      - name: The default build must still be the web image
        run: |
          docker build -t archguard:default .
          if docker run --rm archguard:default python -c "import torch" 2>/dev/null; then
            echo "::error::a bare docker build now produces the worker image"
            exit 1
          fi
          echo "the default build is still the web image"

  visual-regression:
    name: Visual regression
    needs: [docker]
    runs-on: ubuntu-latest
    # `continue-on-error: true` was here with a TODO. It made the only browser
    # test of the website incapable of failing the build, which is the same as
    # not having one.

    # Same reason as the accessibility job below: this server serves pages that
    # resolve an identity out of `users` before they render, so without a
    # database every test here would assert against the sign-in overlay. This
    # job never reached that point -- it needs `docker`, which needs `test` --
    # so the defect was latent rather than absent.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: archguard
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: archguard_browser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U archguard -d archguard_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://archguard:ci_local_only@127.0.0.1:5432/archguard_browser
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
      # webkit as well as chromium: the `mobile` project is devices['iPhone SE'],
      # whose defaultBrowserType is webkit. Installing only chromium left every
      # mobile test failing to launch a browser, so the whole project has never
      # run here -- ten of the nineteen accessibility tests, reported as ten
      # test failures rather than one missing download.
      - run: npx playwright install --with-deps chromium webkit
      - run: pip install "poetry==2.4.1" && poetry config virtualenvs.in-project true && poetry install --with dev

      - name: Create the schema
        run: poetry run alembic upgrade head

      - name: Start the dashboard
        run: |
          poetry run uvicorn archguard.dashboard.app:app --host 127.0.0.1 --port 8765 --log-level warning &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health > /dev/null 2>&1 && break
            sleep 1
          done
        env:
          SESSION_SECRET: ci-session-secret-not-used-anywhere-real-0123456789
          # Two browser suites drive this one server, several requests per page
          # load, from a single address. The default 50/minute is a bound on
          # abusive traffic, not on a test run, and hitting it makes
          # /api/v1/auth/status answer 429 -- at which point the page shows the
          # sign-in overlay and every assertion about signed-in chrome fails
          # for a reason that has nothing to do with what is being tested.
          ARCHGUARD_RATE_LIMIT_MAX_REQUESTS: '100000'
          # One of these tests drives the AI advisor. Without a key the
          # capabilities endpoint reports the feature unavailable and the
          # template renders its input `disabled`, so the test waited thirty
          # seconds to fill a box that can never accept text -- a failure about
          # configuration wearing the costume of a broken control.
          #
          # The mock is what the Python jobs already use for the same reason:
          # it serves canned responses so the feature genuinely works without a
          # key. Set here and not on the snapshot job, whose baselines were
          # recorded with the AI notice showing.
          ARCHGUARD_MOCK_LLM: '1'
      # Behaviour, not pixels: these drive the page and assert what happens.
      # Blocking, because a broken control is a bug wherever it is found. All
      # four were failing silently under the old `continue-on-error: true` --
      # two mocked API paths that had been renamed, one selector naming a
      # generated element id that no longer exists, and one opening the
      # dashboard with no job_id, which correctly renders the empty state and
      # hides every control the test then waited thirty seconds for.
      - name: Run browser behaviour tests
        run: npx playwright test tests/visual/ --grep-invert "@snapshot"
        env:
          # This job starts the server above; it cannot be stale.
          PLAYWRIGHT_REUSE_SERVER: '1'
      - name: Upload diff artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: test-results/

  visual-snapshots:
    name: Visual snapshots (advisory)
    needs: [docker]
    runs-on: ubuntu-latest
    # Advisory on purpose, and this is the only job that is. Baselines are
    # platform-specific and go stale whenever the UI changes deliberately,
    # which is not a regression. The diff artifact is the point: a reviewer
    # looks at it and either accepts the change or does not.
    #
    # The committed -linux baselines are currently stale by design: they
    # predate the determinate progress bar, the sign-in overlay, the account
    # bar and the delete-account control. Refresh them by running the
    # "Regenerate visual baselines" workflow (visual-baselines.yml) from the
    # Actions tab and committing the artifact it produces -- they can only be
    # produced on a Linux runner with this Chromium build, which is why they
    # went stale in the first place. Keep the steps there in step with the
    # steps here; images generated under a different setup are not comparable
    # against this job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
      # webkit as well as chromium: the `mobile` project is devices['iPhone SE'],
      # whose defaultBrowserType is webkit. Installing only chromium left every
      # mobile test failing to launch a browser, so the whole project has never
      # run here -- ten of the nineteen accessibility tests, reported as ten
      # test failures rather than one missing download.
      - run: npx playwright install --with-deps chromium webkit
      - run: pip install "poetry==2.4.1" && poetry config virtualenvs.in-project true && poetry install --with dev
      - name: Run snapshot comparisons
        run: npx playwright test tests/visual/ --grep "@snapshot"
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diff
          path: test-results/

  accessibility:
    name: Browser journeys (axe-core + end-to-end)
    runs-on: ubuntu-latest

    # The dashboard reads PostgreSQL on the first request of every page: the
    # local-development identity is a row in `users`, resolved before anything
    # renders. Started without a database it answered the auth probe with a
    # 500, auth.js raised the sign-in overlay it owns for exactly that case,
    # and every assertion past it addressed a page that was never reached --
    # the tablist was behind the overlay, and the API failure banner stayed
    # hidden because status.js deliberately leaves AUTH failures to the
    # overlay. Four tests failed describing a missing database as an
    # accessibility defect.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: archguard
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: archguard_browser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U archguard -d archguard_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://archguard:ci_local_only@127.0.0.1:5432/archguard_browser
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
      # webkit as well as chromium: the `mobile` project is devices['iPhone SE'],
      # whose defaultBrowserType is webkit. Installing only chromium left every
      # mobile test failing to launch a browser, so the whole project has never
      # run here -- ten of the nineteen accessibility tests, reported as ten
      # test failures rather than one missing download.
      - run: npx playwright install --with-deps chromium webkit
      - run: pip install "poetry==2.4.1" && poetry config virtualenvs.in-project true && poetry install --with dev

      # An empty database is not enough: the identity lookup needs the tables.
      - name: Create the schema
        run: poetry run alembic upgrade head

      - name: Start the dashboard
        run: |
          poetry run uvicorn archguard.dashboard.app:app --host 127.0.0.1 --port 8765 --log-level warning &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health > /dev/null 2>&1 && break
            sleep 1
          done
        env:
          SESSION_SECRET: ci-session-secret-not-used-anywhere-real-0123456789
          # See the note on the same variable in visual-regression: two browser
          # suites share this server, and the default 50/minute bound is for
          # abusive traffic rather than a test run.
          ARCHGUARD_RATE_LIMIT_MAX_REQUESTS: '100000'
      # Serious and critical only, for now. The CSS already carries real
      # accessibility intent -- prefers-reduced-motion, prefers-contrast,
      # :focus-visible -- and the JS does not; P2-5 closes that gap and can
      # tighten this threshold once it has.
      - name: Run axe-core
        run: npx playwright test tests/a11y/
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'

      # On the same server rather than in a job of its own: booting a second
      # one costs a minute to prove the same thing twice. These cover what only
      # a real browser can -- that a control exists, that pressing it goes
      # somewhere, and that the page it left is no longer on screen.
      - name: Run the end-to-end journeys
        run: npx playwright test tests/e2e/
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
