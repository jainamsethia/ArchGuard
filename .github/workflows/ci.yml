name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check archguard/ || true
      - name: Type check
        run: mypy archguard/ --ignore-missing-imports || true
      - name: Unit tests
        run: pytest tests/unit -v --tb=short
      - name: Integration tests
        if: env.GEMINI_API_KEY == ''
        run: pytest tests/integration -v --tb=short
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: .pytest_cache/
          if-no-files-found: ignore

  docker-test:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t archguard:test .
      - name: Test Non-Root User
        run: |
          USER=$(docker run --rm archguard:test whoami)
          if [ "$USER" != "archguard" ]; then
            echo "Expected user archguard, got $USER"
            exit 1
          fi
          echo "Running as correct user: $USER"
      - name: Test ArchGuard Command
        run: docker run --rm archguard:test archguard --version
