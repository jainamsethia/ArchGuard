version: "3.0"
modules:
  - name: api
    path: api
    coupling_budget: 3
    semantic_drift_threshold: 0.25
    disallowed_imports:
      - db
  - name: db
    path: db
    coupling_budget: 3
    semantic_drift_threshold: 0.25
  - name: utils
    path: utils
    coupling_budget: 3
    semantic_drift_threshold: 0.25
fail_threshold: 0.75
warn_threshold: 0.50
weights:
  layer1: 0.25
  layer2: 0.25
  layer3: 0.25
  layer4: 0.25
skip_layers:
  - semantic
  - duplication

fitness_functions:
  - name: "no_circular_deps"
    rule: "graph.cycles == 0"
    severity: critical

  - name: "api_cannot_import_db"
    rule: "module[api] must not import module[db]"
    severity: critical

  - name: "low_violation_count"
    rule: "violation_count <= 50"
    severity: warn
