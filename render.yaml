services:
  - type: web
    name: archguard
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ARCHGUARD_DASHBOARD_ALLOW_REMOTE
        value: "1"
      # Secrets — set these in the Render dashboard, not here
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ARCHGUARD_DASHBOARD_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
