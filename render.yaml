services:
  - type: web
    name: archguard
    runtime: docker
    dockerfilePath: ./Dockerfile
    # /ready, not /health: a check that returns 200 whenever the process is
    # alive reports a service as healthy while its database is unreachable and
    # every request is failing, which stops the platform rolling back.
    healthCheckPath: /ready
    disk:
      name: archguard-cache
      mountPath: /app/.archguard-cache
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      # ARCHGUARD_DASHBOARD_ALLOW_REMOTE is intentionally omitted.
      # Set ARCHGUARD_DASHBOARD_TOKEN in the Render dashboard secrets instead.
      # See .env.example for instructions.
      # Secrets — set these in the Render dashboard, not here
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # REQUIRED: Set this in the Render dashboard → Environment → Secret Files
      # before making your service public. Generate with:
      # python -c "import secrets; print(secrets.token_hex(32))"
      - key: ARCHGUARD_DASHBOARD_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ARCHGUARD_TRUSTED_PROXY_IPS
        value: "*"
      # Wired by reference, never as a literal: the value is a credential and
      # this file is committed. Render substitutes it at deploy time.
      - key: DATABASE_URL
        fromDatabase:
          name: archguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: archguard-redis
          property: connectionString
      # Required from P0-6 on: the session cookie HMAC key, distinct from the
      # ops token. Generate with `python -c "import secrets; print(secrets.token_hex(32))"`.
      - key: SESSION_SECRET
        sync: false
      # Register the OAuth app with callback <origin>/auth/github/callback.
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false

  # The analysis worker. Without it the site accepts jobs and never runs them:
  # `queue_available()` returns true as soon as REDIS_URL is set, so every
  # submission is enqueued, the browser gets a job id and a progress stream,
  # and the queue simply grows. docker-compose declared a worker from the
  # start, which is why local development worked and this was invisible.
  #
  # No healthCheckPath: it serves no port. Liveness is the queue draining,
  # which the web service reports on /metrics.
  - type: worker
    name: archguard-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render builds a Dockerfile path without naming a stage, so the build
    # argument is what selects the worker image -- the one carrying torch,
    # faiss and pip-audit, with the embedding model already baked in. Set it in
    # the Render dashboard under this service's Environment as a build-time
    # variable. See docs/DEPLOYMENT.md: this is the one part of the Render
    # setup that cannot be proven from the repository.
    dockerCommand: docker-entrypoint.sh arq archguard.worker.main.WorkerSettings
    envVars:
      - key: ARCHGUARD_IMAGE
        value: worker
      - key: ENVIRONMENT
        value: production
      # Both are required, and for different reasons: without Redis the worker
      # has no queue to read, and without PostgreSQL it cannot record the
      # analysis it just performed.
      - key: DATABASE_URL
        fromDatabase:
          name: archguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: archguard-redis
          property: connectionString
      # Analysis calls the GitHub API for repository metadata and clones over
      # HTTPS; the LLM key powers the advisor's explanations.
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # The worker signs the audit trail with the same key as the web process,
      # or the two write entries that cannot be verified against each other.
      - key: SESSION_SECRET
        sync: false
      - key: ARCHGUARD_DASHBOARD_TOKEN
        sync: false
    disk:
      # The embedding cache and the audit trail, written by whichever process
      # runs the analysis -- which, now that there is a worker, is this one.
      name: archguard-worker-cache
      mountPath: /app/.archguard-cache
      sizeGB: 1

databases:
  - name: archguard-db
    databaseName: archguard
    user: archguard
    plan: basic-256mb

  - type: redis
    name: archguard-redis
    plan: free
    # Sessions, rate-limit counters and job progress. No inbound public access.
    ipAllowList: []
