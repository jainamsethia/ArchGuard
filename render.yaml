services:
  - type: web
    name: archguard
    runtime: docker
    dockerfilePath: ./Dockerfile
    # /ready, not /health: a check that returns 200 whenever the process is
    # alive reports a service as healthy while its database is unreachable and
    # every request is failing, which stops the platform rolling back.
    healthCheckPath: /ready
    disk:
      name: archguard-cache
      mountPath: /app/.archguard-cache
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      # ARCHGUARD_DASHBOARD_ALLOW_REMOTE is intentionally omitted.
      # Set ARCHGUARD_DASHBOARD_TOKEN in the Render dashboard secrets instead.
      # See .env.example for instructions.
      # Secrets — set these in the Render dashboard, not here
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # REQUIRED: Set this in the Render dashboard → Environment → Secret Files
      # before making your service public. Generate with:
      # python -c "import secrets; print(secrets.token_hex(32))"
      - key: ARCHGUARD_DASHBOARD_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ARCHGUARD_TRUSTED_PROXY_IPS
        value: "*"
      # Wired by reference, never as a literal: the value is a credential and
      # this file is committed. Render substitutes it at deploy time.
      - key: DATABASE_URL
        fromDatabase:
          name: archguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: archguard-redis
          property: connectionString
      # Required from P0-6 on: the session cookie HMAC key, distinct from the
      # ops token. Generate with `python -c "import secrets; print(secrets.token_hex(32))"`.
      - key: SESSION_SECRET
        sync: false
      # Register the OAuth app with callback <origin>/auth/github/callback.
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false

  # The analysis worker. Without it the site accepts jobs and never runs them:
  # `queue_available()` returns true as soon as REDIS_URL is set, so every
  # submission is enqueued, the browser gets a job id and a progress stream,
  # and the queue simply grows. docker-compose declared a worker from the
  # start, which is why local development worked and this was invisible.
  #
  # No healthCheckPath: it serves no port. Liveness is the queue draining,
  # which the web service reports on /metrics.
  - type: worker
    name: archguard-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render builds a Dockerfile path without naming a stage, so the build
    # argument is what selects the worker image -- the one carrying torch,
    # faiss and pip-audit, with the embedding model already baked in. Set it in
    # the Render dashboard under this service's Environment as a build-time
    # variable. See docs/DEPLOYMENT.md: this is the one part of the Render
    # setup that cannot be proven from the repository.
    dockerCommand: docker-entrypoint.sh arq archguard.worker.main.WorkerSettings
    envVars:
      - key: ARCHGUARD_IMAGE
        value: worker
      - key: ENVIRONMENT
        value: production
      # Both are required, and for different reasons: without Redis the worker
      # has no queue to read, and without PostgreSQL it cannot record the
      # analysis it just performed.
      - key: DATABASE_URL
        fromDatabase:
          name: archguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: archguard-redis
          property: connectionString
      # Analysis calls the GitHub API for repository metadata and clones over
      # HTTPS; the LLM key powers the advisor's explanations.
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # SESSION_SECRET and ARCHGUARD_DASHBOARD_TOKEN are deliberately absent.
      # They were here because the worker ran the web process's configuration
      # gate, which demanded them -- and the note that used to sit here said
      # the worker "signs the audit trail" with them, which was not true. The
      # audit log is signed with ARCHGUARD_AUDIT_SECRET; SESSION_SECRET is the
      # session-cookie HMAC and ARCHGUARD_DASHBOARD_TOKEN authenticates
      # operator API calls, and neither is read anywhere this process
      # executes. The gate is role-aware now, so the worker asks for what it
      # uses and nothing else: two fewer copies of a credential.
    disk:
      # The audit trail, written by whichever process runs the analysis --
      # which, now that there is a worker, is this one. Not the embedding
      # cache: that resolves under the cloned repository in /tmp, not here.
      #
      # Optional. Nothing reads this file back -- every dashboard read is a
      # PostgreSQL query -- so the disk buys durability for a write-only trail
      # across deploys, and losing it costs no feature. Keep it if you want the
      # trail to survive a restart; drop it and the path stays writable in the
      # image, which is all /ready probes for.
      name: archguard-worker-cache
      mountPath: /app/.archguard-cache
      sizeGB: 1

  # In `services`, not `databases`. `databases` is PostgreSQL only; a Key Value
  # instance is a service, and declaring it there meant the blueprint promised
  # a Redis it would not create -- leaving both `fromService` references above
  # pointing at nothing.
  - type: redis
    name: archguard-redis
    # NOT `free`, and this is a data-durability decision rather than a
    # performance one. Free Key Value instances do not persist to disk: Render
    # restarts them at its discretion and all data is lost when it does.
    #
    # What lives in here is not all regenerable. Rate-limit counters and the
    # evolution cache are. The arq job queue and every signed-in session are
    # not: a restart drops queued analyses on the floor and signs out every
    # user. Queued jobs do eventually reconcile -- `fail_stalled_jobs` marks
    # any non-terminal job older than the timeout as failed the next time a
    # worker starts -- but "eventually failed" is not "ran".
    #
    # `256mb` is the smallest plan that persists -- the same one Render's own
    # Sidekiq blueprint picks, and for the same reason. Development and CI use
    # a throwaway Redis container and want none of this; see
    # docs/DEPLOYMENT.md.
    plan: 256mb
    # Render's own recommendation for a queue workload. The blueprint default
    # is `allkeys-lru`, which is right for a cache and wrong here: under memory
    # pressure it would evict queued jobs and live sessions to make room.
    maxmemoryPolicy: noeviction
    # Sessions, rate-limit counters and job progress. No inbound public access.
    ipAllowList: []

databases:
  - name: archguard-db
    databaseName: archguard
    user: archguard
    plan: basic-256mb
