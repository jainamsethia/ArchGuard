services:
  - type: web
    name: archguard
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: archguard-cache
      mountPath: /app/.archguard-cache
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      # ARCHGUARD_DASHBOARD_ALLOW_REMOTE is intentionally omitted.
      # Set ARCHGUARD_DASHBOARD_TOKEN in the Render dashboard secrets instead.
      # See .env.example for instructions.
      # Secrets — set these in the Render dashboard, not here
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # REQUIRED: Set this in the Render dashboard → Environment → Secret Files
      # before making your service public. Generate with:
      # python -c "import secrets; print(secrets.token_hex(32))"
      - key: ARCHGUARD_DASHBOARD_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ARCHGUARD_TRUSTED_PROXY_IPS
        value: "*"
      # Wired by reference, never as a literal: the value is a credential and
      # this file is committed. Render substitutes it at deploy time.
      - key: DATABASE_URL
        fromDatabase:
          name: archguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: archguard-redis
          property: connectionString
      # Required from P0-6 on: the session cookie HMAC key, distinct from the
      # ops token. Generate with `python -c "import secrets; print(secrets.token_hex(32))"`.
      - key: SESSION_SECRET
        sync: false
      # Register the OAuth app with callback <origin>/auth/github/callback.
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false

databases:
  - name: archguard-db
    databaseName: archguard
    user: archguard
    plan: basic-256mb

  - type: redis
    name: archguard-redis
    plan: free
    # Sessions, rate-limit counters and job progress. No inbound public access.
    ipAllowList: []
