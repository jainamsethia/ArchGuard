[tool.poetry]
name = "archguard"
version = "0.1.0"
description = "Architectural drift detector for Python codebases."
authors = []
readme = "README.md"
packages = [{include = "archguard"}]
include = [
    {path = "archguard/templates/*"}
]

[tool.poetry.scripts]
archguard = "archguard.cli.main:main"

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = ">=0.9,<1.0"}
rich = ">=13.0"
pyyaml = ">=6.0"
jsonschema = ">=4.17"
requests = ">=2.28"
tree-sitter = ">=0.21,<0.22"
tree-sitter-python = ">=0.21"
networkx = ">=3.0"
python-louvain = ">=0.16"
pydriller = ">=2.5"
"ruamel.yaml" = ">=0.18"
httpx = ">=0.25"

[tool.poetry.extras]
ml = ["numpy", "scipy", "sentence-transformers", "faiss-cpu"]
cloud = ["anthropic"]
cloud-cache = ["boto3"]
all = ["numpy", "scipy", "sentence-transformers", "faiss-cpu", "anthropic", "boto3"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
mypy = ">=1.0"
types-PyYAML = "*"
pre-commit = ">=3.0"
pytest-cov = ">=4.0"
pytest-asyncio = ">=0.23"

[tool.poetry.group.ml.dependencies]
numpy = ">=1.24"
scipy = ">=1.10"
sentence-transformers = ">=2.2"
faiss-cpu = ">=1.7"

[tool.poetry.group.cloud.dependencies]
anthropic = ">=0.20"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "archguard.cli.*",
    "archguard.patch",
    "archguard.patch_paths",
    "archguard.profiles.*",
    "archguard.utils.*",
    "archguard.audit.*",
    "archguard.analysis.*",
    "archguard.llm.*",
    "archguard.github.*"
]
ignore_errors = true

[project]
name = "archguard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.17",
    "jsonschema>=4.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "networkx>=3.0",
    "python-louvain>=0.16",
    "pydriller>=2.5",
    "httpx>=0.25.0",
    "anthropic>=0.20.0",
    "requests>=2.28",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]
cloud = [
    "boto3>=1.28.0",
]
github = [
    "PyGithub>=1.59.0",
]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "click>=8.1",
    "pre-commit>=3.0",
]
all = [
    "archguard[ml,cloud,github,dev]",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=archguard --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60"
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m not integration')",
    "slow: marks tests as slow-running",
]
