[tool.poetry]
name = "archguard"
version = "0.3.0"
description = "Architectural drift detector for Python codebases."
authors = ["Jainam Sethia <jainamsethia8@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "archguard"}]
include = [
    {path = "archguard/templates/*"},
    {path = "archguard/py.typed"}
]

[tool.poetry.scripts]
archguard = "archguard.cli.main:main"

[tool.poetry.dependencies]
python = "^3.11"
typer = ">=0.9,<1.0"
rich = ">=13.0"
pyyaml = ">=6.0"
jsonschema = ">=4.17"
ruamel-yaml = ">=0.18"
tree-sitter = ">=0.21,<0.22"
tree-sitter-python = ">=0.21,<0.22"
networkx = ">=3.0"
python-louvain = ">=0.16"
pydriller = ">=2.5"
# Transitive via pydriller, but pinned directly: 3.1.50 carries 15 known
# advisories (GHSA-2f96-g7mh-g2hx and others) that pip-audit hard-fails CI on.
gitpython = ">=3.1.58"
httpx = ">=0.25"
watchdog = ">=3.0.0"
anthropic = {version = ">=0.109.0,<0.112.0", optional = true}
pydantic = ">=2.0,<3.0"
numpy = {version = ">=1.24,<2.0.0", optional = true}
scipy = {version = ">=1.10", optional = true}
sentence-transformers = {version = ">=2.2", optional = true}
# Transitive via sentence-transformers. 2.12.1 carries PYSEC-2025-194 and also
# caps setuptools<82, which holds setuptools on a version with PYSEC-2026-3447.
torch = {version = ">=2.13.0", optional = true}
# Pulled in as a runtime dependency of torch (which only floors it at 77.0.3).
# Floored here because < 83.0.0 carries PYSEC-2026-3447.
setuptools = {version = ">=83.0.0", optional = true}
faiss-cpu = {version = ">=1.7", optional = true}
boto3 = {version = ">=1.28.0", optional = true}
fastapi = {version = ">=0.100.0", optional = true}
uvicorn = {version = ">=0.23.0", optional = true}
python-multipart = {version = ">=0.0.9", optional = true}
jinja2 = {version = ">=3.1,<4.0.0", optional = true}

cachetools = ">=5.0"
python-dotenv = "^1.2.2"

[tool.poetry.extras]
ml = ["numpy", "scipy", "sentence-transformers", "faiss-cpu", "torch", "setuptools"]
cloud = ["anthropic", "boto3"]

dashboard = ["fastapi", "uvicorn", "python-multipart", "jinja2"]
all = ["numpy", "scipy", "sentence-transformers", "faiss-cpu", "torch", "setuptools", "anthropic", "boto3", "fastapi", "uvicorn", "python-multipart"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
pytest-benchmark = ">=4.0"
pytest-asyncio = ">=0.23"
pytest-timeout = ">=2.2"
mypy = ">=1.5"
ruff = ">=0.1"
pre-commit = ">=3.0"
types-PyYAML = "*"
pip-audit = ">=2.6"
fastapi = ">=0.100.0"
build = ">=1.0"
bandit = "^1.9.4"


[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "tree_sitter.*",
    "faiss.*",
    "sentence_transformers.*",
    "community.*",
    "pydriller.*",
    "jsonschema.*",
    "networkx.*",
    "boto3.*",
    "scipy.*",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=archguard --cov-report=term --cov-report=xml --cov-fail-under=76 -m 'not integration and not slow'"
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: requires external dependencies (real git repo, network, API keys)",
    "slow: marks tests as slow-running",
]
