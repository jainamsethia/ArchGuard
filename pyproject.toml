[tool.poetry]
name = "archguard"
version = "0.1.0"
description = "Architectural drift detector for Python codebases."
authors = []
readme = "README.md"
packages = [{include = "archguard"}]
include = [
    {path = "archguard/templates/*"}
]

[tool.poetry.scripts]
archguard = "archguard.cli.main:main"

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = ">=0.9,<1.0"}
rich = ">=13.0"
pyyaml = ">=6.0"
jsonschema = ">=4.17"
requests = ">=2.28"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
mypy = ">=1.0"
types-PyYAML = "*"
pre-commit = ">=3.0"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[project]
name = "archguard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9,<1.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.17",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "click>=8.1",
    "pre-commit>=3.0",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=archguard --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60"
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m not integration')",
    "slow: marks tests as slow-running",
]
