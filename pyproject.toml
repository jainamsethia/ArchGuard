[tool.poetry]
name = "archguard"
version = "0.1.0"
description = "Architectural drift detector for Python codebases."
authors = []
readme = "README.md"
packages = [{include = "archguard"}]
include = [
    {path = "archguard/templates/*"},
    {path = "archguard/py.typed"}
]

[tool.poetry.scripts]
archguard = "archguard.cli.main:main"

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = ">=0.9,<1.0"}
rich = ">=13.0"
pyyaml = ">=6.0"
jsonschema = ">=4.17"
requests = ">=2.28"
tree-sitter = ">=0.21,<0.22"
tree-sitter-python = ">=0.21"
networkx = ">=3.0"
python-louvain = ">=0.16"
pydriller = ">=2.5"
"ruamel.yaml" = ">=0.17"
httpx = ">=0.25"
PyGithub = ">=1.59.0"
watchdog = ">=3.0.0"

[tool.poetry.extras]
ml = ["numpy", "scipy", "sentence-transformers", "faiss-cpu"]
cloud = ["anthropic", "boto3"]
dashboard = ["fastapi", "uvicorn"]
all = ["numpy", "scipy", "sentence-transformers", "faiss-cpu", "anthropic", "boto3", "fastapi", "uvicorn"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
pytest-benchmark = ">=4.0"
pytest-asyncio = ">=0.23"
mypy = ">=1.5"
ruff = ">=0.1"
pre-commit = ">=3.0"
types-PyYAML = "*"
pip-audit = ">=2.6"

[tool.poetry.group.ml.dependencies]
numpy = ">=1.24,<2.0.0"
scipy = ">=1.10"
sentence-transformers = ">=2.2"
faiss-cpu = ">=1.7"

[tool.poetry.group.cloud.dependencies]
anthropic = ">=0.20"
boto3 = ">=1.28.0"

[tool.poetry.group.dashboard.dependencies]
fastapi = ">=0.100.0"
uvicorn = ">=0.23.0"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "tree_sitter.*",
    "faiss.*",
    "sentence_transformers.*",
    "community.*",
    "pydriller.*",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=archguard --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70"
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m not integration')",
    "slow: marks tests as slow-running",
]
