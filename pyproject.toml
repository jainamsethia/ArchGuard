[tool.poetry]
name = "archguard"
version = "0.3.0"
description = "Architectural drift detector for Python codebases."
authors = ["Jainam Sethia <jainamsethia8@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "archguard"}]
include = [
    {path = "archguard/templates/*"},
    {path = "archguard/py.typed"}
]

[tool.poetry.scripts]
archguard = "archguard.cli.main:main"

[tool.poetry.dependencies]
python = "^3.11"
typer = ">=0.9,<1.0"
rich = ">=13.0"
pyyaml = ">=6.0"
jsonschema = ">=4.17"
ruamel-yaml = ">=0.18"
tree-sitter = ">=0.21,<0.22"
tree-sitter-python = ">=0.21,<0.22"
networkx = ">=3.0"
python-louvain = ">=0.16"
pydriller = ">=2.5"
# Transitive via pydriller, but pinned directly: 3.1.50 carries 15 known
# advisories (GHSA-2f96-g7mh-g2hx and others) that pip-audit hard-fails CI on.
gitpython = ">=3.1.58"
httpx = ">=0.25"
watchdog = ">=3.0.0"
pydantic = ">=2.0,<3.0"
numpy = {version = ">=1.24,<2.0.0", optional = true}
scipy = {version = ">=1.10", optional = true}
sentence-transformers = {version = ">=2.2", optional = true}
# Transitive via sentence-transformers. 2.12.1 carries PYSEC-2025-194 and also
# caps setuptools<82, which holds setuptools on a version with PYSEC-2026-3447.
torch = {version = ">=2.13.0", optional = true}
# Pulled in as a runtime dependency of torch (which only floors it at 77.0.3).
# Floored here because < 83.0.0 carries PYSEC-2026-3447.
setuptools = {version = ">=83.0.0", optional = true}
faiss-cpu = {version = ">=1.7", optional = true}
boto3 = {version = ">=1.28.0", optional = true}
fastapi = {version = ">=0.100.0", optional = true}
uvicorn = {version = ">=0.23.0", optional = true}
python-multipart = {version = ">=0.0.9", optional = true}
jinja2 = {version = ">=3.1,<4.0.0", optional = true}

cachetools = ">=5.0"
python-dotenv = "^1.2.2"

[tool.poetry.extras]
ml = ["numpy", "scipy", "sentence-transformers", "faiss-cpu", "torch", "setuptools"]
# NOTE: "cloud" now means S3 sync (boto3) only. LLM support is no longer an
# extra: Gemini is reached over HTTP with httpx, which is a core dependency,
# so AI features work from a plain `pip install archguard`.
cloud = ["boto3"]

dashboard = ["fastapi", "uvicorn", "python-multipart", "jinja2"]
all = ["numpy", "scipy", "sentence-transformers", "faiss-cpu", "torch", "setuptools", "boto3", "fastapi", "uvicorn", "python-multipart"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
pytest-benchmark = ">=4.0"
pytest-asyncio = ">=0.23"
pytest-timeout = ">=2.2"
mypy = ">=1.5"
# Floored at the version whose rule set matches [tool.ruff.lint] below. The old
# ">=0.1" floor meant `ruff check` ran whatever defaults the installed ruff
# happened to have, so the lint gate's meaning drifted with every release.
ruff = ">=0.15,<0.17"
pre-commit = ">=3.0"
types-PyYAML = "*"
pip-audit = ">=2.6"
fastapi = ">=0.100.0"
build = ">=1.0"
bandit = "^1.9.4"


[tool.ruff]
# Pinned explicitly. With no [tool.ruff] section at all, `ruff check` ran
# whatever the installed ruff's *default* rule set happened to be -- which
# expanded between 0.1 (the floor in dev-dependencies) and 0.16, so the CI
# lint gate quietly changed meaning on every ruff release.
target-version = "py311"
line-length = 100
# Fixture repositories are *inputs* to the analyser, not source. Their unused
# imports and forbidden cross-module imports are the planted violations the
# correctness tests assert on -- linting (let alone autofixing) them deletes
# the very thing under test.
extend-exclude = ["tests/fixtures", "tests/integration/fixtures"]
# force-exclude makes the exclusion hold even when a path is passed explicitly
# on the command line -- which is exactly how pre-commit invokes ruff, and how
# a fixture's planted violations got autofixed away in the first place.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplifications
    "PL",     # pylint subset
    "RUF",    # ruff-specific
    "ASYNC",  # blocking calls in async functions
    "LOG",    # logging misuse
    "PIE",
    "PYI",
    "TRY",
]
ignore = [
    "E501",     # line length: enforced by the formatter, not the linter
    "B008",     # FastAPI's Depends()/Query() idiom is a call in a default arg
    "B904",     # implicit exception chaining already reports the cause
    "PLC0415",  # deliberate: lazy imports keep optional extras off the CLI's
                # import path and break dashboard route/app import cycles
    "PLC0414",  # `import X as X` is the explicit re-export form mypy wants
    "PLR0911",  # return-count limits produce worse code in dispatch functions
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",  # "magic value" flags every threshold constant in scoring
    "RUF001",   # the en-dashes and middots in user-facing strings are intended
    "RUF002",
    "RUF003",
    "SIM108",   # ternary-vs-if is a readability call, not a rule
    "SIM112",   # %SystemDrive% is spelled that way on Windows
    "TRY003",   # long messages inside raise: the messages are the UX here
    "TRY300",
    "TRY301",
    "TRY401",   # duplicating the exception in the message is harmless next to
                # the traceback .exception() already emits
    "PLW2901",  # rebinding a loop variable while normalising it is idiomatic
    "SIM102",   # nested ifs often read better than a compound condition
    "SIM105",   # try/except/pass is clearer than contextlib.suppress in tests
    "PLC0206",
    "PYI024",
    "UP042",    # (str, Enum) members serialise as their value through json;
                # StrEnum would also change str(member) and the SSE payloads
    "ASYNC109", # cancel_all_running(timeout=) forwards to asyncio.wait
    # ASYNC240 flags every pathlib/os.path call in an async def. The ones that
    # actually walked a repository have been moved to asyncio.to_thread; the
    # rest are pure path arithmetic with no I/O, and ArchGuard does not depend
    # on trio or anyio.Path.
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on internals, bind mocks they never call, and shell out without
# checking exit codes on purpose.
"tests/**" = ["F841", "PLW1510", "RUF012", "B017", "SIM117", "E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "tree_sitter.*",
    "faiss.*",
    "sentence_transformers.*",
    "community.*",
    "pydriller.*",
    "jsonschema.*",
    "networkx.*",
    "boto3.*",
    "scipy.*",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=archguard --cov-report=term --cov-report=xml --cov-fail-under=76 -m 'not integration and not slow'"
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: requires external dependencies (real git repo, network, API keys)",
    "slow: marks tests as slow-running",
]
